services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rms-backend-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - rms_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: rms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rms_redis_data:/data

volumes:
  rms_uploads:
  rms_redis_data:

